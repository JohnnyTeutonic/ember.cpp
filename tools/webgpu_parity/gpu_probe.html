<!doctype html>
<html><head><meta charset="utf-8"><title>WebGPU adapter probe</title></head>
<body><pre id="out">pending</pre>
<script type="module">
// Which WebGPU adapter this browser offers, and that a compute shader runs on it: 4M floats through
// y = 2x + 1, read back and checked, then 200 dispatches of the same shader timed. Driven by
// remote_chrome.py (POST /e6/result); the driver refuses a software adapter.
import { adapterInfo, describe, guard, result } from './e6_common.js';
guard(async () => {
  if (!navigator.gpu) { await result({ error: 'navigator.gpu is undefined', pass: false }); return; }
  const out = { userAgent: navigator.userAgent, crossOriginIsolated: self.crossOriginIsolated };
  for (const pp of ['high-performance', 'low-power']) {
    const a = await navigator.gpu.requestAdapter({ powerPreference: pp });
    out[pp] = adapterInfo(a);
  }
  const fb = await navigator.gpu.requestAdapter({ forceFallbackAdapter: true });
  out.fallback = fb ? describe(adapterInfo(fb)) : null;
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  out.adapter = adapterInfo(adapter);
  if (!adapter) { await result({ ...out, error: 'no adapter', pass: false }); return; }
  const device = await adapter.requestDevice();
  const n = 1 << 22;
  const mod = device.createShaderModule({ code: `
    @group(0) @binding(0) var<storage, read> x: array<f32>;
    @group(0) @binding(1) var<storage, read_write> y: array<f32>;
    @compute @workgroup_size(256) fn main(@builtin(global_invocation_id) g: vec3<u32>) {
      if (g.x < arrayLength(&x)) { y[g.x] = 2.0 * x[g.x] + 1.0; } }` });
  const pipe = device.createComputePipeline({ layout: 'auto', compute: { module: mod, entryPoint: 'main' } });
  const xs = new Float32Array(n).map((_, i) => i % 1000);
  const bx = device.createBuffer({ size: 4 * n, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const by = device.createBuffer({ size: 4 * n, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const rb = device.createBuffer({ size: 4 * n, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(bx, 0, xs);
  const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: bx } }, { binding: 1, resource: { buffer: by } }] });
  const run = async (reps, read) => {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pipe); pass.setBindGroup(0, bg);
    for (let r = 0; r < reps; r++) pass.dispatchWorkgroups(n / 256);
    pass.end();
    if (read) enc.copyBufferToBuffer(by, 0, rb, 0, 4 * n);
    device.queue.submit([enc.finish()]);
    if (read) { await rb.mapAsync(GPUMapMode.READ); const v = new Float32Array(rb.getMappedRange().slice(0)); rb.unmap(); return v; }
    await device.queue.onSubmittedWorkDone();
    return null;
  };
  const v = await run(1, true);
  let bad = 0;
  for (let i = 0; i < n; i++) if (v[i] !== 2 * xs[i] + 1) bad++;
  await run(10, false);
  const t0 = performance.now();
  await run(200, false);
  const ms = performance.now() - t0;
  out.compute = { n, wrong: bad, ms_200_dispatches: ms, gb_per_s: (200 * 8 * n) / (ms * 1e6) };
  out.pass = bad === 0;
  document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(out);
  await result(out);
});
</script></body></html>
