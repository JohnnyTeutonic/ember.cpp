<!doctype html>
<html><head><meta charset="utf-8"><title>page worker parity</title></head>
<body><pre id="out">pending</pre>
<script type="module">
// The Space page's own worker (worker.js) on both backends, WebGPU and ?backend=wasm, with the 40
// greedy requests of greedy.json: replies must be identical to each other and to ember CPU's.
// Serve a built Space folder (tools/build_wasm_space.sh) with greedy.json copied in, then
// PAGE=page_test.html python3 run.py PORT, or on a GPU VM remote_chrome.py --page page_test.html (with
// e6_common.js beside it: the result also goes to POST /e6/result, with the adapter the page sees).
// Requests: prompts.json ([{user_input}], sent as greedy requests of 60 new tokens), or with
// ?requests=R.jsonl the {"i", "request"} rows sent as they are (multi-turn requests with history).
// greedy.json: {"prompts": [{reply}]} (make_greedy_fixture.sh) or {"replies": [{reply}]}, in that order.
const out = document.getElementById('out');
const q = new URLSearchParams(location.search);
let e6 = null;
try { e6 = await import('./e6_common.js'); } catch { /* run.py's folder has no driver endpoints */ }
function startWorker(qs) {
  return new Promise((resolve, reject) => {
    const w = new Worker('worker.js' + qs);
    const pending = new Map();
    let id = 0;
    w.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'ready') {
        if (m.ok !== 1) reject(new Error('worker not ready: ' + (m.error || m.ok)));
        else resolve({ backend: m.backend, w, ask: (req) => new Promise((r) => { pending.set(++id, r); w.postMessage({ id, req }); }) });
      } else if (m.type === 'reply') { const r = pending.get(m.id); pending.delete(m.id); r(m.out); }
    };
  });
}
try {
  const fxDoc = await (await fetch('greedy.json')).json();
  const fx = fxDoc.prompts || fxDoc.replies;
  const requests = q.get('requests')
    ? (await (await fetch(q.get('requests'))).text()).split(/\r?\n/).filter(Boolean).map((l) => JSON.parse(l).request)
    : (await (await fetch('prompts.json')).json()).map((p) => ({ user_input: p.user_input, max_new_tokens: 60, temperature: 1.0, top_k: 1, top_p: 1.0, seed: 0 }));
  const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
  const res = {};
  for (const qs of ['', '?backend=wasm']) {
    const w = await startWorker(qs);
    const t0 = performance.now(), replies = [];
    for (const req of requests) replies.push(await w.ask(req));
    res[w.backend] = { replies, ms_per_reply: (performance.now() - t0) / requests.length };
    w.w.terminate();
  }
  const g = res.webgpu, c = res.wasm;
  const same = (a, b) => a.reply === b.reply && a.stop_reason === b.stop_reason && a.tokens === b.tokens;
  const r = {
    backends: Object.keys(res), n: requests.length, adapter: e6 && adapter ? e6.adapterInfo(adapter) : null,
    webgpu_vs_wasm: g && c ? g.replies.filter((x, i) => same(x, c.replies[i])).length : null,
    webgpu_vs_ember_cpu: g ? g.replies.filter((x, i) => x.reply === fx[i].reply).length : null,
    wasm_vs_ember_cpu: c ? c.replies.filter((x, i) => x.reply === fx[i].reply).length : null,
    tokens: g ? g.replies.reduce((a, x) => a + (x.tokens || 0), 0) : null,
    errors: Object.values(res).reduce((a, v) => a + v.replies.filter((x) => x.error).length, 0),
    ms_per_reply: Object.fromEntries(Object.entries(res).map(([k, v]) => [k, v.ms_per_reply])),
    first_diffs: g && c ? g.replies.map((x, i) => [i, x.reply, c.replies[i].reply]).filter(([, a, b]) => a !== b).slice(0, 3) : [],
    replies: Object.fromEntries(Object.entries(res).map(([k, v]) => [k, v.replies])),
  };
  r.pass = !!(g && c) && r.webgpu_vs_wasm === r.n && r.webgpu_vs_ember_cpu === r.n && r.wasm_vs_ember_cpu === r.n && !r.errors;
  const { replies, ...shown } = r;
  out.textContent = 'RESULT ' + JSON.stringify(shown);
  if (e6) await e6.result(r);
} catch (e) {
  out.textContent = 'ERROR ' + (e.stack || e);
  if (e6) await e6.result({ error: String(e.stack || e), pass: false });
}
</script></body></html>
