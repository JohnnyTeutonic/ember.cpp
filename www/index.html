<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ember chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ember chat</h1>
    <p id="model-info" style="text-align:center;color:#666;font-size:0.9em;margin-top:-0.5em"></p>
    <div id="chatbox">
        <div id="history">
            <p class="server-message">AI: Hello! How can I help you today?</p>
        </div>
        <div id="input-area">
            <input type="text" id="message" placeholder="Enter your message...">
            <button id="send">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
